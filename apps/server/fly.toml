# Fly.io config for the realtime server. Deploy from the repo root:
#   fly launch --config apps/server/fly.toml --dockerfile apps/server/Dockerfile --no-deploy
#   fly secrets set YOUTUBE_API_KEY=... CORS_ORIGIN=https://jamwave.app
#   fly deploy --config apps/server/fly.toml --dockerfile apps/server/Dockerfile
app = "jamwave-server"
primary_region = "sin"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"   # rooms live in memory: keep one machine running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
