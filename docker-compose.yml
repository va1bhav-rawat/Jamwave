# Self-hosted Jamwave: `docker compose up --build`
# Web on http://localhost:3000, realtime server on http://localhost:4000
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ROOM_EMPTY_TTL_MINUTES: ${ROOM_EMPTY_TTL_MINUTES:-10}
      RECLAIM_GRACE_SECONDS: ${RECLAIM_GRACE_SECONDS:-60}
      SEARCH_RATE_PER_MINUTE: ${SEARCH_RATE_PER_MINUTE:-10}
      SEARCH_DAILY_CAP: ${SEARCH_DAILY_CAP:-95}
      ROOM_CREATE_RATE_PER_MINUTE: ${ROOM_CREATE_RATE_PER_MINUTE:-5}
      ROOM_JOIN_RATE_PER_MINUTE: ${ROOM_JOIN_RATE_PER_MINUTE:-30}
      MAX_ROOMS: ${MAX_ROOMS:-5000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-20}
      JAM_TOKEN_SECRET: ${JAM_TOKEN_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    ports:
      - '3000:3000'
    environment:
      SOCKET_INTERNAL_URL: http://server:4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/jamwave}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      JAM_TOKEN_SECRET: ${JAM_TOKEN_SECRET:-}
    depends_on:
      - server
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
